[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vcf2pdf"
version = "0.2.0"
description = "Render a vCard (.vcf) address book as a printable PDF directory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "amir mosadeghi(github.com/mosadeghi)" }]
dependencies = [
    "vobject",
    "reportlab",
    "arabic-reshaper",
    "python-bidi",
]

[project.scripts]
vcf2pdf = "vcf2pdf.cli:main"
vcf2pdf-gui = "vcf2pdf.gui.app:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
build = ["pyinstaller>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88